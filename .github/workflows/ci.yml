name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Install & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist output (SEO & static files)
        run: |
          for f in \
            index.html \
            404.html \
            robots.txt \
            sitemap.xml \
            llms.txt \
            manifest.json \
            _headers \
            resume.html \
            "Lucky Joshi - Resume.pdf" \
            apple-touch-icon.png \
            icon-192.png \
            icon-512.png \
            preview.png \
            lucky-joshi.webp \
            projects/mentixo-ai/index.html \
            projects/devflow/index.html \
            projects/periodic-table-game/index.html \
            projects/spyderman-shooting-game/index.html; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::Missing dist/$f"
              exit 1
            fi
          done
          grep -q 'id="root"' dist/index.html || { echo "::error::dist/index.html has no #root mount point"; exit 1; }
          grep -qE '/assets/index-.*\.js' dist/index.html || { echo "::error::dist/index.html does not reference built JS bundle"; exit 1; }
          grep -q 'href="/sitemap.xml"' dist/index.html || { echo "::error::sitemap link missing from dist/index.html"; exit 1; }
          grep -q 'Who is' dist/index.html || { echo "::error::prerendered content missing from dist/index.html (not crawlable)"; exit 1; }
          grep -q 'Mentixo AI' dist/index.html || { echo "::error::project content missing from dist/index.html"; exit 1; }
          grep -q 'application/ld+json' dist/index.html || { echo "::error::structured data missing from dist/index.html"; exit 1; }
          grep -q 'BreadcrumbList' dist/projects/mentixo-ai/index.html || { echo "::error::breadcrumb schema missing from project page"; exit 1; }
          echo "dist output OK"
